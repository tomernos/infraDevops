name: 'Terraform Plan and Apply'

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      terraform_dir:
        description: 'Directory, where .hcl files are stored'
        default: './'
        type: string
      always_plan:
        description: 'Always plan, even if there are no changes'
        default: false
        type: boolean
      runner-group:
        description: 'Runner label or runner group to use for plan/apply jobs'
        default: 'ubuntu-latest'
        type: string
      tf_storage_sub_id:
        description: 'Azure subscription ID to set before terraform init (for remote state storage)'
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  tf_version: '1.8.5'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      any_changes: ${{ steps.changed-files.outputs.changes_any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      - name: Determine Changed Files for Cloud and Environment
        id: changed-files
        uses: tj-actions/changed-files@v46.0.1
        with:
          files_yaml: |
            changes:
              - '**/*.tf'
              - 'tfvars/${{ inputs.env }}.tfvars'
      
  plan:
    runs-on: ${{ inputs.runner-group }}
    needs: check
    if: ${{ needs.check.outputs.any_changes == 'true' || inputs.always_plan }}
    outputs:
      changes: ${{ steps.run-terraform.outputs.changes }}
      dirname: ${{ steps.set-dirname.outputs.dirname }}
    steps:
      - name: Install AZ CLI
        run: |
          # Install az cli
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Install the gh cli
        uses: ksivamuthu/actions-setup-gh-cli@v3
        with:
           version: 2.24.3

      - name: Install unzip
        run: sudo apt-get install -y unzip

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.tf_version }}
          terraform_wrapper: false

      - name: Decode and retrieve Azure credentials
        id: get-creds
        env:
          AZURE_ORG_CREDS: ${{ secrets.AZURE_ORG_CREDS_DOFINITY }}
        run: |
          # Save the JSON to a temporary file
          echo "${AZURE_ORG_CREDS}" > creds.json
          
          # Parse and convert to a single-line JSON for the selected environment
          CREDENTIALS=$(jq -c ".${{ inputs.env }}" creds.json)
          
          # Export the single-line JSON to GITHUB_ENV
          echo "CREDENTIALS=$CREDENTIALS" >> $GITHUB_ENV
          
          # Extract and set ARM environment variables for Terraform
          # These are required for Terraform's Azure provider authentication
          echo "ARM_CLIENT_ID=$(jq -r '.${{ inputs.env }}.clientId' creds.json)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(jq -r '.${{ inputs.env }}.clientSecret' creds.json)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(jq -r '.${{ inputs.env }}.subscriptionId' creds.json)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(jq -r '.${{ inputs.env }}.tenantId' creds.json)" >> $GITHUB_ENV
          if [ -n "${{ inputs.tf_storage_sub_id }}" ]; then
            echo "ARM_SUBSCRIPTION_ID=${{ inputs.tf_storage_sub_id }}" >> $GITHUB_ENV
          fi


      - name: Set up Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ env.CREDENTIALS }}
      
    

      # - name: Set up Authentication for Terraform Modules
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.DEVOPS_TOKEN }}
      #   run: |
      #     git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      - id: app-token
        name: Create GitHub App token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ELECTRA_MODULES_APP_ID }}
          private-key: ${{ secrets.MODULES_APP_SECRET }}
          owner: ElectraOrg
          repositories: | 
            Electra-terraform-modules
            ${{ github.event.repository.name }}
            
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git to use token for module clones
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          GIT_CONFIG_FILE=$(mktemp)
          printf '[url "https://x-access-token:%s@github.com/"]\n\tinsteadOf = https://github.com/\n' "${GH_APP_TOKEN}" > "$GIT_CONFIG_FILE"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_FILE" >> $GITHUB_ENV
        shell: bash

      - name: Set directory name
        id: set-dirname
        run: echo "dirname=$(basename ${{ inputs.terraform_dir }})" >> $GITHUB_OUTPUT

      - name: Run terraform plan
        id: run-terraform
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          if [ -n "${{ inputs.tf_storage_sub_id }}" ]; then
            az account set --subscription ${{ inputs.tf_storage_sub_id }}
          fi
          terraform init -backend-config="backend.conf" -upgrade
          terraform workspace select ${{ inputs.env }} || terraform workspace new ${{ inputs.env }}
          terraform validate
          terraform plan -lock=false -no-color -out=${{ inputs.env }}-${{ steps.set-dirname.outputs.dirname }}-plan.tfplan -var-file=tfvars/${{ inputs.env }}.tfvars

          # Check for any errors in the plan process
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "Terraform plan failed in $dir"
            exit 1
          fi
          
          # Get human-readable output from the plan file
          terraform show -no-color ${{ inputs.env }}-${{ steps.set-dirname.outputs.dirname }}-plan.tfplan > plan_output.txt
          
          # Check if there are any changes in the plan
          if grep -q "No changes" plan_output.txt; then
            echo "No changes in Plan"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "Found changes in Plan"
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
    

      - name: Upload tfplan
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.env }}-${{ steps.set-dirname.outputs.dirname }}-plan.tfplan
          path: ${{ inputs.terraform_dir }}
          if-no-files-found: 'error'
          overwrite: true
          
      - name: Post PR comment
        uses: borchero/terraform-plan-comment@v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          header: "🚀 Terraform Plan for ${{ inputs.env }}"
          planfile: ${{ inputs.env }}-${{ steps.set-dirname.outputs.dirname }}-plan.tfplan
          working-directory: ${{ inputs.terraform_dir }}

      - name: Find Comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          body-includes: Terraform Plan for ${{ steps.set-dirname.outputs.dirname }}-${{ inputs.env }}
      - name: Fail if terraform failed
        if: steps.run-terraform.outcome == 'failure'
        run: exit 1

  apply:
    runs-on: ${{ inputs.runner-group }}
    needs: plan
    environment: terraform-${{ inputs.env }}
    if: ${{ needs.plan.outputs.changes == 'true' }}
    steps:
      - name: Install AZ CLI
        run: |
          # Install az cli
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Install the gh cli
        uses: ksivamuthu/actions-setup-gh-cli@v3
        with:
           version: 2.24.3
           
      
      - name: Checkout
        uses: actions/checkout@v5
        
      # - name: Check PR Approval Status
      #   if: ${{ inputs.env == 'prod' }}
      #   id: check_approval
      #   env:
      #     GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      #   run: |
      #     approvals=$(gh pr view ${{ github.event.pull_request.number }} --json reviews --jq '.reviews | map(select(.state == "APPROVED")) | length')
      #     if [ "$approvals" -eq 0 ]; then
      #       echo "Pull request is not approved. Failing job."
      #       exit 1
      #     fi

      - name: Install unzip
        run: sudo apt-get install -y unzip

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.tf_version }}
          terraform_wrapper: false

      - name: Decode and retrieve Azure credentials
        id: get-creds
        env:
          AZURE_ORG_CREDS: ${{ secrets.AZURE_ORG_CREDS_DOFINITY }}
        run: |
          # Save the JSON to a temporary file
          echo "${AZURE_ORG_CREDS}" > creds.json
          
          # Parse and convert to a single-line JSON for the selected environment
          CREDENTIALS=$(jq -c ".${{ inputs.env }}" creds.json)
          
          # Export the single-line JSON to GITHUB_ENV
          echo "CREDENTIALS=$CREDENTIALS" >> $GITHUB_ENV
          
          # Extract and set ARM environment variables for Terraform
          # These are required for Terraform's Azure provider authentication
          echo "ARM_CLIENT_ID=$(jq -r '.${{ inputs.env }}.clientId' creds.json)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(jq -r '.${{ inputs.env }}.clientSecret' creds.json)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(jq -r '.${{ inputs.env }}.subscriptionId' creds.json)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(jq -r '.${{ inputs.env }}.tenantId' creds.json)" >> $GITHUB_ENV
          if [ -n "${{ inputs.tf_storage_sub_id }}" ]; then
            echo "ARM_SUBSCRIPTION_ID=${{ inputs.tf_storage_sub_id }}" >> $GITHUB_ENV
          fi

      - name: Set up Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ env.CREDENTIALS }}
      
      - name: Azure WhoAmI
        run: az account show

      - id: app-token
        name: Create GitHub App token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ELECTRA_MODULES_APP_ID }}
          private-key: ${{ secrets.MODULES_APP_SECRET }}
          owner: ElectraOrg
          repositories: | 
            Electra-terraform-modules
            ${{ github.event.repository.name }}

      - name: Set up Authentication for Terraform Modules
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          GIT_CONFIG_FILE=$(mktemp)
          printf '[url "https://x-access-token:%s@github.com/"]\n\tinsteadOf = https://github.com/\n' "${GH_APP_TOKEN}" > "$GIT_CONFIG_FILE"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_FILE" >> $GITHUB_ENV

      - name: Download plan file
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.env }}-${{ needs.plan.outputs.dirname }}-plan.tfplan
          path: ${{ inputs.terraform_dir }}


      - name: Terraform apply
        id: run-terraform
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          if [ -n "${{ inputs.tf_storage_sub_id }}" ]; then
            az account set --subscription ${{ inputs.tf_storage_sub_id }}
          fi
          terraform init -backend-config="backend.conf" -upgrade
          terraform workspace select ${{ inputs.env }}
          terraform validate
          terraform apply -lock=false -no-color -auto-approve "${{ inputs.env }}-${{ needs.plan.outputs.dirname }}-plan.tfplan"

          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "Terraform apply failed"
          fi

      - name: Create Terraform Apply Output String
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          # Define the output file path
          OUTPUT_FILE="terraform_apply_output_comment.txt"

          # Write the formatted title and output to a file
          echo "## 🚀 Terraform Apply for ${{ inputs.env }}:" > $OUTPUT_FILE
          echo "<details><summary>Click to expand</summary>" >> $OUTPUT_FILE
          echo "" >> $OUTPUT_FILE
          if [ -f apply_output.txt ]; then
            echo "### Apply Output" >> $OUTPUT_FILE
            echo '```' >> $OUTPUT_FILE
            cat apply_output.txt >> $OUTPUT_FILE  # Format output with terraform-landscape
            echo '```' >> $OUTPUT_FILE
          else
            echo "No terraform apply output files found." >> $OUTPUT_FILE
          fi
          echo "</details>" >> $OUTPUT_FILE

      - name: Publish terraform Apply Output as a PR Comment
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          # Read the content of the output file and post as a comment
          COMMENT_BODY="$(cat terraform_apply_output_comment.txt)"
          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT_BODY"
