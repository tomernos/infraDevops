name: "Terraform Plan"
# Runs automatically on PRs to main when infra files change.
# For manual runs: use "Terraform Apply" with dry_run checked.

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "**.hcl"
      - ".github/workflows/tf-plan.yml"
      - ".github/workflows/_tf-core.yml"

concurrency:
  group: tf-plan-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  core:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/_tf-core.yml
    with:
      environment: sandbox
      region:      me-west1
      action:      plan
    secrets: inherit
