name: "Terraform Plan"
# Runs on PRs to main and on manual dispatch.
# Posts per-module plan results as a PR comment.

on:
  pull_request:
    branches: [main]
    paths: ["**.tf", "**.hcl", ".github/workflows/tf-plan.yml", ".github/workflows/_tf-core.yml"]

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan"
        type: choice
        options: [sandbox]
        default: sandbox
      region:
        description: "GCP region"
        type: choice
        options: [me-west1]
        default: me-west1

concurrency:
  group: tf-plan-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  core:
    uses: ./.github/workflows/_tf-core.yml
    with:
      environment: ${{ inputs.environment || 'sandbox' }}
      region:      ${{ inputs.region      || 'me-west1' }}
      action:      plan
    secrets: inherit
