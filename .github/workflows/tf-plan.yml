name: "Terraform Plan"
# Triggered on PRs to main, OR manually via workflow_dispatch.
# Environments are folders, not branches: regions/<region>/<env>/.
#
# PR path: detect changed envs from git diff, plan only what changed.
# Manual path: plan the selected environment directly — useful for previewing
#   before a manual apply dispatch.
#
# Detects which env folders the PR touches, then matrix-calls _tf-core
# once per affected env. Shared changes (modules/, root.hcl, workflow files)
# trigger plans for ALL existing env folders.

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/**"
      - "regions/**"
      - "root.hcl"
      - ".github/workflows/tf-plan.yml"
      - ".github/workflows/_tf-core.yml"
      - ".github/actions/tf-setup/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan"
        type: choice
        options: [dev, sandbox, staging, prod]
        required: true
      use_self_hosted:
        description: "Run on the Cloud Run self-hosted runner instead of GitHub-hosted"
        type: boolean
        required: false
        default: false

concurrency:
  group: tf-plan-${{ github.head_ref || inputs.environment }}
  cancel-in-progress: true

jobs:
  detect:
    name: "Detect changed environments"
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.detect.outputs.envs }}
      region: ${{ steps.detect.outputs.region }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Detect"
        id: detect
        run: |
          REGION="me-west1"

          # Manual dispatch — plan exactly the selected environment.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVS='["${{ inputs.environment }}"]'
            echo "::notice::Manual dispatch — planning env: ${{ inputs.environment }}"
            echo "envs=$ENVS" >> "$GITHUB_OUTPUT"
            echo "region=$REGION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "${BASE}...HEAD" 2>/dev/null || git diff --name-only HEAD~1 HEAD)

          echo "Changed files:"
          echo "$CHANGED"
          echo ""

          # Shared changes affect every environment — plan them all.
          SHARED_RX="^(modules/|root\.hcl|\.github/workflows/_tf-core\.yml|\.github/actions/tf-setup/)"
          if echo "$CHANGED" | grep -qE "$SHARED_RX"; then
            ENVS=$(find "regions/$REGION" -maxdepth 1 -mindepth 1 -type d \
              -not -name "_*" \
              -printf "%f\n" 2>/dev/null \
              | sort | jq -R . | jq -sc .)
            echo "::notice::Shared infra change — planning all envs: $ENVS"
          else
            ENVS=$(echo "$CHANGED" \
              | grep -oP "^regions/$REGION/\K[^/]+" \
              | sort -u | jq -R . | jq -sc .)
            echo "::notice::Per-env change detected: $ENVS"
          fi

          [ -z "$ENVS" ] || [ "$ENVS" = "null" ] && ENVS="[]"
          echo "envs=$ENVS" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"

  plan:
    name: "Plan ${{ matrix.env }}"
    needs: [detect]
    if: needs.detect.outputs.envs != '[]'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.detect.outputs.envs) }}
    uses: ./.github/workflows/_tf-core.yml
    with:
      environment: ${{ matrix.env }}
      region:      ${{ needs.detect.outputs.region }}
      action:      plan
      use_self_hosted: ${{ inputs.use_self_hosted || false }}
    secrets: inherit
