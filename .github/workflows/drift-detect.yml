name: Drift Detection

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC daily — 8am Israel time
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to check"
        type: choice
        options: [sandbox, staging, prod]
        default: sandbox

concurrency:
  group: drift-${{ inputs.environment || 'sandbox' }}
  cancel-in-progress: true

jobs:
  # ── 1. Resolve project_id from env name ──────────────────────────────────────
  setup:
    name: "Resolve project"
    runs-on: ubuntu-latest
    outputs:
      project_id: ${{ steps.resolve.outputs.project_id }}
      env_name:   ${{ steps.resolve.outputs.env_name }}
    steps:
      - name: "Resolve"
        id: resolve
        run: |
          ENV="${{ inputs.environment || 'sandbox' }}"
          case "$ENV" in
            sandbox) PROJECT="cryptoshare-e5172" ;;
            staging) PROJECT="sweptlock-staging" ;;
            prod)    PROJECT="sweptlock-prod" ;;
            *) echo "::error::Unknown env $ENV"; exit 1 ;;
          esac
          echo "project_id=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "env_name=$ENV"       >> "$GITHUB_OUTPUT"

  # ── 2. Detect drift ───────────────────────────────────────────────────────────
  drift:
    name: "Detect drift — ${{ needs.setup.outputs.env_name }}"
    needs: [setup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write

    env:
      ENV_NAME:   ${{ needs.setup.outputs.env_name }}
      PROJECT_ID: ${{ needs.setup.outputs.project_id }}
      DRIFT_LABEL: "infrastructure-drift"
      TERRAGRUNT_NON_INTERACTIVE: "true"
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"

    steps:
      - uses: actions/checkout@v4

      - name: "Setup Terraform + Terragrunt + GCP auth"
        uses: ./.github/actions/tf-setup
        with:
          service-account: ${{ secrets.SA_CI_TF_PLAN_EMAIL }}
          wif-provider:    ${{ secrets.WIF_PROVIDER }}
          project-id:      ${{ needs.setup.outputs.project_id }}

      # Run plan across all modules. No -detailed-exitcode — that exits 2 per module
      # with drift which Terragrunt treats as a dependency failure, cascading to all
      # downstream modules. Parse output for changes instead.
      - name: "Run plan"
        id: plan
        working-directory: regions/me-west1/${{ env.ENV_NAME }}
        run: |
          set -o pipefail
          EXIT=0
          terragrunt run --all plan -- -no-color 2>&1 | tee /tmp/plan.txt || EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"

      - name: "Parse drift summary"
        id: summary
        run: |
          PLAN=$(cat /tmp/plan.txt)

          ADDS=$(echo "$PLAN"    | grep -oP '\d+(?= to add)'    | paste -sd+ | bc 2>/dev/null || echo 0)
          CHANGES=$(echo "$PLAN" | grep -oP '\d+(?= to change)' | paste -sd+ | bc 2>/dev/null || echo 0)
          DESTROYS=$(echo "$PLAN"| grep -oP '\d+(?= to destroy)'| paste -sd+ | bc 2>/dev/null || echo 0)

          HAS_DRIFT=false
          [ "$((ADDS + CHANGES + DESTROYS))" -gt 0 ] && HAS_DRIFT=true

          echo "adds=$ADDS"           >> "$GITHUB_OUTPUT"
          echo "changes=$CHANGES"     >> "$GITHUB_OUTPUT"
          echo "destroys=$DESTROYS"   >> "$GITHUB_OUTPUT"
          echo "has_drift=$HAS_DRIFT" >> "$GITHUB_OUTPUT"

          TRUNCATED=$(echo "$PLAN" | tail -c 60000)
          echo "plan_body<<EOF"   >> "$GITHUB_OUTPUT"
          echo "$TRUNCATED"       >> "$GITHUB_OUTPUT"
          echo "EOF"              >> "$GITHUB_OUTPUT"

      # ── Open or update drift issue ────────────────────────────────────────────
      - name: "Open or update drift issue"
        if: steps.summary.outputs.has_drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const env      = process.env.ENV_NAME;
            const adds     = '${{ steps.summary.outputs.adds }}';
            const changes  = '${{ steps.summary.outputs.changes }}';
            const destroys = '${{ steps.summary.outputs.destroys }}';
            const plan     = `${{ steps.summary.outputs.plan_body }}`;
            const label    = `${{ env.DRIFT_LABEL }}-${env}`;
            const runUrl   = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const title = `🚨 Infrastructure Drift — ${env} (+${adds} ~${changes} -${destroys})`;
            const body = [
              `## Infrastructure Drift Detected — \`${env}\``,
              ``,
              `| Metric | Count |`,
              `|---|---|`,
              `| Resources to add | \`${adds}\` |`,
              `| Resources to change | \`${changes}\` |`,
              `| Resources to destroy | \`${destroys}\` |`,
              `| Detected | ${new Date().toISOString()} |`,
              `| Workflow run | [View logs](${runUrl}) |`,
              ``,
              `## Plan output`,
              `\`\`\`hcl`,
              plan,
              `\`\`\``,
              ``,
              `## Resolution`,
              `Open a PR with the fix, or run \`terragrunt run --all apply\` in \`regions/me-west1/${env}\`.`,
            ].join('\n');

            // Ensure label exists (per-env label so multiple envs don't collide)
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: label, color: 'e11d48',
                description: `Infrastructure drift in ${env}`,
              });
            } catch (_) {}

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: label, state: 'open',
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, title,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `### Drift still detected — ${new Date().toISOString()}\n\n+${adds} ~${changes} -${destroys}\n\n[Run logs](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label],
              });
            }

      # ── Close drift issue if resolved ────────────────────────────────────────
      - name: "Close drift issue if resolved"
        if: steps.plan.outputs.exit_code == '0' && steps.summary.outputs.has_drift == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const env   = process.env.ENV_NAME;
            const label = `${{ env.DRIFT_LABEL }}-${env}`;
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: label, state: 'open',
            });

            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Drift resolved — \`${env}\` is back in sync.\n\nAuto-closed by [drift detection run](${runUrl}) on ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }

      # ── Step summary ──────────────────────────────────────────────────────────
      - name: "Drift summary"
        if: always()
        run: |
          EXIT="${{ steps.plan.outputs.exit_code }}"
          DRIFT="${{ steps.summary.outputs.has_drift }}"
          ADDS="${{ steps.summary.outputs.adds }}"
          CHANGES="${{ steps.summary.outputs.changes }}"
          DESTROYS="${{ steps.summary.outputs.destroys }}"
          {
            echo "## Drift Detection — \`${{ env.ENV_NAME }}\`"
            echo "| | |"
            echo "|---|---|"
            if [ "$EXIT" = "1" ]; then
              echo "| **Result** | ❌ Plan error — check logs |"
            elif [ "$DRIFT" = "true" ]; then
              echo "| **Result** | 🚨 Drift detected |"
              echo "| **To add** | \`$ADDS\` |"
              echo "| **To change** | \`$CHANGES\` |"
              echo "| **To destroy** | \`$DESTROYS\` |"
            else
              echo "| **Result** | ✅ No drift |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
