name: "TF Core (reusable)"
# Never triggered directly — called by tf-plan.yml and tf-apply.yml.
#
# Flow when action=plan:   discover → plan (parallel) → summarize
# Flow when action=apply:  discover → plan (parallel) → summarize → approve → apply
#
# GitHub Environments required per real env (e.g. "sandbox"):
#   sandbox        — holds secrets (WIF_PROVIDER, SA_CI_TF_PLAN_EMAIL, SA_CI_TF_APPLY_EMAIL), no reviewers
#   sandbox-apply  — required reviewers only, no secrets (this is the human approval gate)

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment — must match folder under regions/<region>/"
        type: string
        required: true
      region:
        description: "GCP region"
        type: string
        default: "me-west1"
      action:
        description: "plan or apply"
        type: string
        default: "plan"

# ── Job 1: Discover ───────────────────────────────────────────────────────────
jobs:
  discover:
    name: "Discover stacks"
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}

    steps:
      - uses: actions/checkout@v4

      - name: "Find terragrunt stacks"
        id: find
        run: |
          DIR="regions/${{ inputs.region }}/${{ inputs.environment }}"
          if [ ! -d "$DIR" ]; then
            echo "::error::$DIR not found — check environment and region inputs"
            exit 1
          fi
          MODULES=$(find "$DIR" \
            -name "terragrunt.hcl" \
            -not -path "*/.terragrunt-cache/*" \
            | xargs -I{} dirname {} \
            | xargs -I{} basename {} \
            | sort \
            | jq -R . | jq -sc .)
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
          echo "Discovered: $MODULES"

# ── Job 2: Plan — parallel matrix, one job per module ────────────────────────
  plan:
    name: "Plan — ${{ matrix.module }}"
    needs: [discover]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: "Install Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: "Install Terragrunt"
        run: |
          VER=$(cat .terragrunt-version 2>/dev/null || echo "0.67.16")
          curl -sSL "https://github.com/gruntwork-io/terragrunt/releases/download/v${VER}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: "Authenticate to GCP"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_CI_TF_PLAN_EMAIL }}

      - name: "Setup gcloud"
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: "Plan ${{ matrix.module }}"
        working-directory: "regions/${{ inputs.region }}/${{ inputs.environment }}/${{ matrix.module }}"
        run: |
          EXIT=0
          terragrunt plan --terragrunt-non-interactive -no-color 2>&1 \
            | tee /tmp/plan-output.txt || EXIT=$?

          PLAN_LINE=$(grep -E "^Plan:|No changes\." /tmp/plan-output.txt | tail -1 || true)

          if [ "$EXIT" -eq 1 ]; then
            STATUS="error"; ADDS=0; CHGS=0; DEST=0
          elif [[ "$PLAN_LINE" == *"No changes"* ]] || [[ -z "$PLAN_LINE" ]]; then
            STATUS="no-changes"; ADDS=0; CHGS=0; DEST=0
          else
            ADDS=$(echo "$PLAN_LINE" | grep -oP '\d+(?= to add)'     | head -1 || echo 0)
            CHGS=$(echo "$PLAN_LINE" | grep -oP '\d+(?= to change)'  | head -1 || echo 0)
            DEST=$(echo "$PLAN_LINE" | grep -oP '\d+(?= to destroy)' | head -1 || echo 0)
            if [ "${DEST:-0}" -gt 0 ]; then STATUS="destroys"; else STATUS="changes"; fi
          fi

          mkdir -p /tmp/artifact
          cp /tmp/plan-output.txt /tmp/artifact/output.txt
          printf '%s\n%s\n%s\n%s\n' "$STATUS" "${ADDS:-0}" "${CHGS:-0}" "${DEST:-0}" \
            > /tmp/artifact/meta.txt

      - name: "Upload plan artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "plan-${{ matrix.module }}"
          path: /tmp/artifact/
          retention-days: 3

# ── Job 3: Summarize — build PR comment + job summary ─────────────────────────
  summarize:
    name: "Summarize"
    needs: [discover, plan]
    if: always()
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: "Download plan artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: "plan-*"
          path: /tmp/plans
          merge-multiple: false

      - name: "Build summary"
        run: |
          MODULES='${{ needs.discover.outputs.modules }}'
          OVERALL="No changes"
          HAS_DESTROYS=false
          TABLE=""
          DETAILS=""

          for MOD in $(echo "$MODULES" | jq -r '.[]'); do
            META="/tmp/plans/plan-${MOD}/meta.txt"
            OUT="/tmp/plans/plan-${MOD}/output.txt"

            if [ -f "$META" ]; then
              STATUS=$(sed -n '1p' "$META")
              ADDS=$(sed -n '2p' "$META")
              CHGS=$(sed -n '3p' "$META")
              DEST=$(sed -n '4p' "$META")

              case "$STATUS" in
                error)      ICON="Error";      OVERALL="Plan failed" ;;
                no-changes) ICON="No changes" ;;
                destroys)   ICON="Destroys";   HAS_DESTROYS=true; [ "$OVERALL" != "Plan failed" ] && OVERALL="Destroys planned" ;;
                changes)    ICON="Changes";    [ "$OVERALL" == "No changes" ] && OVERALL="Changes pending" ;;
              esac
            else
              ICON="Skipped"; ADDS="-"; CHGS="-"; DEST="-"
            fi

            TABLE+="| \`${MOD}\` | ${ICON} | ${ADDS} | ${CHGS} | ${DEST} |"$'\n'

            if [ -f "$OUT" ]; then
              DIFF=$(grep -E "^\s+(#|~|\+|-)\s" "$OUT" | head -20 || true)
              FULL=$(tail -c 5000 "$OUT")
              DETAILS+="<details><summary><b>${MOD}</b> -- ${ICON}</summary>"$'\n\n'
              [ -n "$DIFF" ] && DETAILS+="**Changed resources:**"$'\n''```hcl'$'\n'"${DIFF}"$'\n''```'$'\n\n'
              DETAILS+='```hcl'$'\n'"${FULL}"$'\n''```'$'\n'"</details>"$'\n\n'
            fi
          done

          WARN=""
          [ "$HAS_DESTROYS" = "true" ] && WARN=$'\n'"**WARNING: This plan destroys resources. Review carefully.**"$'\n'

          SHA="${GITHUB_SHA::7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            printf "## Terraform %s -- \`%s\` (\`%s\`)\n\n" "${{ inputs.action }}" "${{ inputs.environment }}" "${{ inputs.region }}"
            printf "Commit: \`%s\` | Actor: @%s | [Run #%s](%s)\n\n" "$SHA" "${{ github.actor }}" "${{ github.run_number }}" "$RUN_URL"
            printf "| Module | Status | Add | Change | Destroy |\n"
            printf "|--------|--------|-----|--------|---------|\n"
            printf "%s" "$TABLE"
            printf "%s\n\n" "$WARN"
            printf "### Module Details\n\n%s" "$DETAILS"
            if [ "${{ inputs.action }}" = "apply" ]; then
              printf "---\n**Next:** approve this run in the GitHub Actions UI to apply.\n"
            fi
          } > /tmp/summary.md

          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: "Post or update PR comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tf-plan-sweptlock -->';
            const body = marker + '\n' + fs.readFileSync('/tmp/summary.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

# ── Job 4: Approve — human reviews the plan and approves here ─────────────────
# The "sandbox-apply" GitHub Environment must have required reviewers configured.
# Reviewer sees the plan in the summarize job summary, then approves this job.
  approve:
    name: "Approve apply"
    needs: [summarize]
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-apply

    steps:
      - name: "Confirmed"
        run: |
          echo "Apply approved by: ${{ github.actor }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Region: ${{ inputs.region }}"

# ── Job 5: Apply — runs after human approval, safety-checks before applying ───
  apply:
    name: "Apply"
    needs: [discover, approve]
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: "Install Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: "Install Terragrunt"
        run: |
          VER=$(cat .terragrunt-version 2>/dev/null || echo "0.67.16")
          curl -sSL "https://github.com/gruntwork-io/terragrunt/releases/download/v${VER}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: "Authenticate to GCP"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_CI_TF_APPLY_EMAIL }}

      - name: "Setup gcloud"
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: "Download approved plan artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: "plan-*"
          path: /tmp/approved-plans
          merge-multiple: false

      - name: "Safety check — verify no new destroys since approval"
        working-directory: "regions/${{ inputs.region }}/${{ inputs.environment }}"
        run: |
          MODULES='${{ needs.discover.outputs.modules }}'
          BLOCKED=false

          for MOD in $(echo "$MODULES" | jq -r '.[]'); do
            APPROVED_META="/tmp/approved-plans/plan-${MOD}/meta.txt"
            APPROVED_DEST=0
            [ -f "$APPROVED_META" ] && APPROVED_DEST=$(sed -n '4p' "$APPROVED_META" || echo 0)

            CURRENT_EXIT=0
            CURRENT_OUT=$(cd "./${MOD}" && terragrunt plan \
              --terragrunt-non-interactive -no-color 2>&1) || CURRENT_EXIT=$?

            CURRENT_DEST=$(echo "$CURRENT_OUT" | grep -oP '\d+(?= to destroy)' | head -1 || echo 0)

            if [ "${CURRENT_DEST:-0}" -gt "${APPROVED_DEST:-0}" ]; then
              echo "::error::$MOD: ${CURRENT_DEST} destroys now vs ${APPROVED_DEST} when approved — re-run plan"
              BLOCKED=true
            else
              echo "  OK  $MOD: destroys=${CURRENT_DEST} (approved: ${APPROVED_DEST})"
            fi
          done

          if [ "$BLOCKED" = "true" ]; then
            echo "::error::Apply blocked — plan changed since approval. Re-run the plan workflow."
            exit 1
          fi

      - name: "Apply all stacks"
        working-directory: "regions/${{ inputs.region }}/${{ inputs.environment }}"
        run: |
          terragrunt run --all apply \
            --terragrunt-non-interactive \
            -auto-approve 2>&1 | tee /tmp/apply-output.txt

      - name: "Apply summary"
        if: always()
        run: |
          {
            echo "## Apply Result -- \`${{ inputs.environment }}\`"
            echo "| | |"
            echo "|---|---|"
            echo "| Status | ${{ job.status }} |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Actor  | @${{ github.actor }} |"
            echo ""
            echo "<details><summary>Apply output</summary>"
            echo ""
            echo '```'
            tail -c 8000 /tmp/apply-output.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

env:
  PROJECT_ID: "cryptoshare-e5172"
