name: "Terraform Apply"
# Manual trigger — select environment and region.
# Flow: plan → summarize (post comment) → approve (human reviews plan) → apply (safety-checked)
#
# Required GitHub Environments:
#   <env>        — holds WIF_PROVIDER, SA_CI_TF_PLAN_EMAIL, SA_CI_TF_APPLY_EMAIL secrets
#   <env>-apply  — required reviewers (the approval gate, no secrets needed)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        type: choice
        options: [sandbox]
        default: sandbox
      region:
        description: "GCP region"
        type: choice
        options: [me-west1]
        default: me-west1

concurrency:
  group: tf-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  core:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/_tf-core.yml
    with:
      environment: ${{ inputs.environment }}
      region:      ${{ inputs.region }}
      action:      apply
    secrets: inherit
