name: "Terraform Apply"
# Manual only — select environment and region from the GitHub Actions UI.
# Plans first, then applies (or dry-run = plan only, no apply).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        type: choice
        options: [sandbox]
        default: sandbox
      region:
        description: "GCP region"
        type: choice
        options: [me-west1]
        default: me-west1
      dry_run:
        description: "Dry run — plan only, do not apply"
        type: boolean
        default: false

jobs:
  core:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/_tf-core.yml
    with:
      environment: ${{ inputs.environment }}
      region:      ${{ inputs.region }}
      action:      apply
      dry_run:     ${{ inputs.dry_run }}
    secrets: inherit
