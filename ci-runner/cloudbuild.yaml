# Build + push the ephemeral Android runner image to Artifact Registry.
#
# Run from this directory:
#   gcloud builds submit --config cloudbuild.yaml \
#     --project sweptlock-dev-844f2 --region me-west1 \
#     --substitutions=_TAG=v1 .
#
# The image is large (Android SDK + NDK ≈ 6–8 GB) so we use a bigger build machine
# and a long timeout. Pushed as :<_TAG> and :latest.

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}:${_TAG}
      - -t
      - ${_IMAGE}:latest
      - .

images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest

substitutions:
  _IMAGE: me-west1-docker.pkg.dev/sweptlock-dev-844f2/swpt-mw1-dev-registry/ci-android-runner
  _TAG: v1

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100

timeout: 2400s
